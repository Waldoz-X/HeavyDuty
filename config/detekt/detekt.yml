# Overrides on top of detekt's default rules (buildUponDefaultConfig), aligned with the project's
# conventions and with ktlint (.editorconfig) so the two never disagree.

style:
  MaxLineLength:
    maxLineLength: 140 # same limit ktlint formats to
  MagicNumber:
    # UI code is full of sizes (16.dp, 0.5f…) that read best inline.
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    # An enum entry names its own arguments: LAST_7_DAYS(7, …).
    ignoreEnums: true
  ReturnCount:
    # Early exits at the top (`?: return`, `if (…) return`) are how Kotlin reads best.
    excludeGuardClauses: true

complexity:
  CyclomaticComplexMethod:
    # A `when` that only dispatches (one call per event) reads flat however many branches it has.
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    # Screens are meant to be split into small composables; counting each one would push
    # toward the opposite — few, long functions.
    ignoreAnnotatedFunctions: ['Composable', 'Preview']
    # A Room DAO is one function per query; splitting it would only scatter the queries.
    ignoreAnnotated: ['Dao']

naming:
  FunctionNaming:
    # Composables are named like types.
    ignoreAnnotated: ['Composable']

Compose:
  CompositionLocalAllowlist:
    active: true
    # Deliberate app-wide locals: the weight unit and the shared-element transition scopes.
    allowedCompositionLocals: ['LocalWeightUnit', 'LocalSharedTransitionScope', 'LocalNavAnimatedVisibilityScope']
