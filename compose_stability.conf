// Classes the Compose compiler should treat as stable (compared with equals() instead of ===).
// Only list types that are never mutated after creation. Gradle doesn't track this file's
// contents: after editing it, rebuild with --rerun (or clean) for the change to apply.

// Domain models: immutable data classes, but core-domain is compiled without the Compose
// compiler, so it can't infer that on its own.
com.example.heavyduty.core.domain.model.**
com.example.heavyduty.core.domain.repository.RestTimerState

// Read-only collections: the app never mutates a List/Map after handing it to the UI.
kotlin.collections.*

// java.time values (LocalDate, Duration…) are immutable by design.
java.time.*
